name: OpenWeb Linux TTY checks

on:
  push:
    branches: [main, tty-rewrite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-and-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check public/js/config.js
          node --check public/js/tty.js
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: npm run check
      - name: Run workspace manager tests
        working-directory: backend
        run: npm test
      - name: Build Ubuntu 24.04 workspace image
        run: docker build -t openweb-linux-ubuntu:24.04 ./backend/ubuntu
