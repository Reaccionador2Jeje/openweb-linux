name: OpenWeb Linux TTY and NELRoot checks

on:
  push:
    branches: [nelroot-backend]
    paths:
      - "index.html"
      - "public/**"
      - "backend/**"
      - "docs/**"
      - ".github/workflows/nelroot-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "public/**"
      - "backend/**"
      - "docs/**"
      - ".github/workflows/nelroot-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check TTY JavaScript syntax
        run: node --check public/js/tty.js
      - name: Check frontend configuration syntax
        run: node --check public/js/config.js

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check backend JavaScript syntax
        run: npm run check
      - name: Run backend unit tests
        run: npm test
